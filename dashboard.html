<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | Arabify</title>
<link rel="icon" href="icon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<style>
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}
  @media (max-width:800px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:18px}
  .stat-card b{display:block;font-size:24px;font-family:var(--font-display)}
  .stat-card span{color:var(--ink-faint);font-size:12.5px}
</style>
</head>
<body>
<header class="nav"><div class="container">
  <a href="index.html" class="nav-brand"><div class="nav-logo">✦</div><b>Arabify</b></a>
  <nav class="nav-links"><a href="index.html" class="nav-link">الرئيسية</a><a href="explore.html" class="nav-link">استكشف</a><a href="editor.html" class="nav-link">إنشاء</a></nav>
  <label class="nav-search">🔍<input type="search" placeholder="بحث..." aria-label="بحث"></label>
  <div class="nav-right">
    
    <div id="navGuest" style="display:flex;gap:8px"><button class="btn btn-ghost" data-modal-open="loginModal">تسجيل الدخول</button><a href="editor.html" class="btn btn-primary">ابدأ التصميم</a></div>
    <div id="navUser" class="menu-wrap" style="display:none"><button id="navMenuToggle" style="background:none;border:0;cursor:pointer;padding:0"><img id="navAvatarImg" class="nav-avatar" src="assets/default-avatar.svg" alt=""></button>
      <div id="navUserMenu" class="menu"><a class="menu-item" href="dashboard.html">🏠 لوحة التحكم</a><a class="menu-item" href="profile.html">👤 ملفي الشخصي</a><a class="menu-item" href="saved.html">🔖 المحفوظات</a><a class="menu-item" href="settings.html">⚙️ الإعدادات</a><div class="menu-sep"></div><button class="menu-item" id="logoutBtn">🚪 تسجيل الخروج</button></div>
    </div>
  </div>
</div></header>

<main class="container" style="padding-top:34px">
  <h1 style="font-family:var(--font-display);font-size:24px;margin:0">أهلًا بعودتك 👋</h1>
  <p style="color:var(--ink-dim);margin:6px 0 0">إليك ملخص نشاطك على Arabify</p>

  <div class="stat-grid">
    <div class="stat-card"><b>12</b><span>مشروع</span></div>
    <div class="stat-card"><b>7</b><span>منشور</span></div>
    <div class="stat-card"><b>4.8K</b><span>مشاهدة</span></div>
    <div class="stat-card"><b>320</b><span>إعجاب</span></div>
  </div>

  <div class="section-head"><div><h2>مشاريعك الأخيرة</h2><p>المسودات والمنشورة معًا</p></div>
    <a href="editor.html" class="section-more">+ مشروع جديد</a>
  </div>
  <div class="masonry" id="dashFeed"></div>
</main>

<footer class="site-footer container"><span>© 2026 Arabify</span><span>صُنع لمجتمع المصممين العرب</span></footer>

<div class="modal-backdrop" id="loginModal"><div class="modal"><button class="modal-close" data-modal-close>✕</button><h3>مرحبًا بعودتك</h3><button class="gbtn" id="googleSignInBtn">المتابعة عبر Google</button></div></div>

<script type="module">
  import { mountMasonryFeed } from "./js/app.js";
  mountMasonryFeed(document.getElementById("dashFeed"), { pageSize: 12 });
</script>
</body>
</html>
